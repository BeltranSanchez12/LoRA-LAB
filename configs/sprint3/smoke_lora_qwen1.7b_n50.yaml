# SMOKE TEST — config mínima para validar el pipeline PEFT end-to-end.
# NO es una celda del grid: pocos pasos, fracción mínima, eval reducido.
experiment:
  name: "smoke_lora_qwen1.7b_n50"
  seed: 42
  overwrite: true        # el smoke se re-ejecuta a voluntad

model:
  base_model: "Qwen/Qwen3-1.7B"
  method: "lora"         # lora | qlora | full_ft
  peft:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

data:
  processed_dir: "data/processed/cardiff_es"
  train_fraction: 50     # 50|100|250|500|1000|full

training:
  max_steps: 30          # smoke: pocos pasos (el grid usará epochs)
  batch_size: 8
  grad_accum: 1
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  max_length: 256
  lr_scheduler_type: "cosine"

eval:
  max_examples: 200      # smoke: subconjunto del test para ir rápido

output:
  results_dir: "results/"
